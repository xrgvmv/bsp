<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa z OpenStreetMap</title>
    <!-- Link do stylów Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
 crossorigin=""></script>
    <style>
        /* Styl dla mapy, aby zajmowała całe okno */
        #map {
            height: 500px;
            width: 500px;
        }
    </style>
</head>
<body>
    <h1>Mapa</h1>
    <div id="map"></div> <!-- Kontener dla mapy -->

    <!-- Link do skryptu Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-o8PCUjzG8Gs5bM8CPw8G+FG0pFMsX1tmw6Mr2lA3Do0=" 
            crossorigin=""></script>
    <script>
        // Inicjalizacja mapy
        var map = L.map('map').setView([51.505, -0.09], 13); // [latitude, longitude], zoom level

        // Dodanie kafelków mapy z OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Przykładowy znacznik na mapie
        L.marker([51.505, -0.09]).addTo(map)
            .bindPopup('To jest przykładowy znacznik!')
            .openPopup();
    </script>
</body>
</html>
