<div class="flight-control-panel" *ngIf="visible">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Dlugość śladu
        <button mat-icon-button (click)="hidePanel()" class="close-button">
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="slider-container">
        <mat-slider
          min="1"
          [max]="movementData.length"
          step="1"
          [(ngModel)]="maxTimestamps"
          (valueChange)="onMaxTimestampsChange($event)"
        >
          <input matSliderThumb [(ngModel)]="maxTimestamps" />
        </mat-slider>
      </div>
    </mat-card-content>
  </mat-card>
</div>
